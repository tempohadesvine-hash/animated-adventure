<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e8d8">
<title>Catgotchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: egg-shaped device with a pixel room on top, stats + action pad below, diary and idea queue last */
:root{
  --bg:#f3e8d8; --panel:#fffaf2; --line:#e3d3bc; --fg:#2e2620; --muted:#86776a;
  --accent:#e0743c; --good:#5aa46b; --warn:#d9534f;
  --shell1:#ffb38a; --shell2:#f07a52; --shellEdge:#c95a35;
  --pixel:"Silkscreen",ui-monospace,monospace; --body:"Nunito",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1714; --panel:#26201b; --line:#3a3029; --fg:#f2e8dc; --muted:#a8998a;
  --accent:#f0905a; --good:#7cc68b; --warn:#ef7a74;
  --shell1:#c96a45; --shell2:#8e3f25; --shellEdge:#5e2814; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1714; --panel:#26201b; --line:#3a3029; --fg:#f2e8dc; --muted:#a8998a;
  --accent:#f0905a; --good:#7cc68b; --warn:#ef7a74;
  --shell1:#c96a45; --shell2:#8e3f25; --shellEdge:#5e2814; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:440px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{font:400 22px/1 var(--pixel);margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
.tag{font:12px var(--pixel);color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.label{font:11px var(--pixel);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button{font:700 14px var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px;cursor:pointer;min-height:46px}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text]{font:15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);width:100%;min-width:0}

/* device */
.shell{background:radial-gradient(120% 90% at 30% 20%,var(--shell1),var(--shell2));
  border:3px solid var(--shellEdge);border-radius:50% 50% 46% 46% / 38% 38% 30% 30%;
  padding:44px 26px 30px;display:grid;gap:12px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.lcd{position:relative;border-radius:12px;border:4px solid #3b2a20;background:#e9dcc5;overflow:hidden;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.08)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer}
.bubble{position:absolute;left:8px;right:8px;top:6px;font:11px/1.3 var(--pixel);color:#3b2a20;
  background:rgba(255,250,240,.88);border-radius:8px;padding:5px 8px;text-align:center;pointer-events:none;min-height:24px}
.gone{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:16px;
  background:rgba(233,220,197,.94);color:#3b2a20}
.gone p{margin:0;font:600 14px var(--body)}
.gone[hidden]{display:none}
.nameplate{display:flex;justify-content:space-between;gap:8px;color:#fff;font:12px var(--pixel);
  text-shadow:0 1px 0 rgba(0,0,0,.3);padding:0 6px}
.nameplate b{font-weight:400;font-size:14px}

/* stats */
.stat{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:10px}
.stat span{font:11px var(--pixel);color:var(--muted)}
.stat output{font:12px var(--pixel);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);transition:width .4s}
.bar i.low{background:var(--warn)}
.bar i.mid{background:var(--accent)}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{display:grid;gap:2px;justify-items:center;padding:8px 4px}
.actions button em{font-style:normal;font-size:20px;line-height:1}
.actions button[disabled]{opacity:.45}
.sheet{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.sheet[hidden]{display:none}

ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#log li{font-size:13px;display:flex;gap:8px}
#log time{font:11px var(--pixel);color:var(--muted);flex:none;padding-top:2px;min-width:44px}

.furs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.furs button{display:grid;justify-items:center;gap:4px;font-size:12px}
.furs button i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.furs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* idea queue */
details.ideas summary{cursor:pointer;font:12px var(--pixel);color:var(--muted);list-style:none}
details.ideas summary::-webkit-details-marker{display:none}
.addidea{display:grid;grid-template-columns:1fr auto;gap:8px}
#ideaList li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px}
#ideaList li.done span{text-decoration:line-through;color:var(--muted)}
#ideaList button{min-height:32px;padding:2px 10px;font-size:13px}
footer{display:flex;justify-content:center}
footer button{background:transparent;border:none;color:var(--muted);font-size:13px;min-height:36px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header><h1>Cat<span>gotchi</span></h1><span class="tag" id="ageTag"></span></header>

  <section id="adopt" class="panel" hidden>
    <div class="label">Adopt a cat</div>
    <input type="text" id="nameIn" maxlength="14" placeholder="Name (e.g. Mochi)" autocomplete="off">
    <div class="furs" id="furs"></div>
    <button class="primary" id="adoptBtn">Bring them home</button>
    <p style="margin:0;font-size:13px;color:var(--muted)">Your cat lives in real time, even when the app is closed. Feed, play and clean a few times a day.</p>
  </section>

  <section id="game" hidden style="display:grid;gap:14px">
    <div class="shell">
      <div class="lcd">
        <canvas id="cv" width="128" height="96" aria-label="Your cat. Tap to pet."></canvas>
        <div class="bubble" id="bubble" aria-live="polite"></div>
        <div class="gone" id="gone" hidden><p id="goneTxt"></p><button class="primary" id="again">Adopt a new cat</button></div>
      </div>
      <div class="nameplate"><b id="nm"></b><span id="info"></span></div>
    </div>

    <div class="panel" id="stats"></div>

    <div class="actions" id="actions">
      <button data-act="feed"><em>🍣</em>Feed</button>
      <button data-act="play"><em>🔴</em>Laser</button>
      <button data-act="pet"><em>💗</em>Pet</button>
      <button data-act="clean"><em>🧽</em>Clean</button>
      <button data-act="sleep" id="sleepBtn"><em>🌙</em>Sleep</button>
      <button data-act="meds"><em>💊</em>Meds</button>
    </div>
    <div class="sheet" id="feedSheet" hidden>
      <button data-food="kibble">Kibble</button>
      <button data-food="treat">Fish treat</button>
      <button data-food="x" aria-label="Close">✕</button>
    </div>

    <div class="panel"><div class="label">Diary</div><ul id="log"></ul></div>
  </section>

  <details class="panel ideas" id="ideas">
    <summary>Idea queue ▾</summary>
    <div class="addidea"><input type="text" id="ideaIn" placeholder="Add an idea…"><button id="ideaAdd">Add</button></div>
    <ul id="ideaList"></ul>
  </details>

  <footer><button id="release" hidden>Release cat & start over</button></footer>
</main>

<script>
(() => {
const KEY='catgotchi.v1', IKEY='catgotchi.ideas';
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- sprites (16 x 15) ---------- */
const BASE=[
"...o........o...",
"..ofo......ofo..",
"..ofpo....opfo..",
"..offooooooffo..",
"..offffffffffo..",
"..offeffffeffo..",
"..offeffffeffo..",
"..offffppffffo..",
"..offfwwwwfffo..",
"...offffffffo...",
"...offffffffo..o",
"..offfwwwwfffo.o",
"..offfwwwwfffo.o",
"..offffffffffooo",
"..oowoooooowoo.."];
const mod=(rows)=>{const r=BASE.slice();for(const k in rows)r[k]=rows[k];return r};
const SPR={
  idle:BASE,
  blink:mod({5:"..offffffffffo..",6:"..ofooffffoofo.."}),
  eat:mod({5:"..offffffffffo..",6:"..ofooffffoofo..",8:"..offfwppwfffo.."}),
  happy:mod({5:"..offffffffffo..",6:"..offeffffeffo..",7:"..ofpffppffpfo.."}),
  sad:mod({7:"..offbfppfbffo.."}),
  sick:mod({7:"..ofgffppffgfo.."})
};
const POOP=["..u..",".uuu.","uuuuu"];
const HEART=["pp.pp","ppppp",".ppp.","..p.."];
const BOWL=["oooooo",".oooo."];
const FURS={
  ginger:{label:'Ginger',f:'#ec9a4f',w:'#fbe7cf',o:'#3a2a20'},
  grey:{label:'Grey',f:'#98a4ac',w:'#eaeff2',o:'#2c3236'},
  black:{label:'Black',f:'#3d3d46',w:'#cfcfd6',o:'#101014'},
  cream:{label:'Cream',f:'#efdfc0',w:'#fffaf0',o:'#5a4a36'}};
const palette=fur=>({o:FURS[fur].o,f:FURS[fur].f,w:FURS[fur].w,e:'#16120f',p:'#f29bb0',b:'#5aa9e6',g:'#8fbf6a',u:'#7a5230'});

/* ---------- state ---------- */
let s=store.get(KEY);
let furPick='ginger';
const anim={x:56,tx:56,dir:1,eatUntil:0,hearts:[],sparkle:0,lastPet:0,blinkAt:0,say:null,sayUntil:0};
let game=null;

const clamp=v=>Math.max(0,Math.min(100,v));
function clampAll(){for(const k of ['full','fun','energy','clean','health'])s[k]=clamp(s[k])}
function log(m,t=Date.now()){s.log.unshift({t,m});s.log=s.log.slice(0,10)}
function save(){store.set(KEY,s)}
const ageH=()=>(Date.now()-s.born)/3.6e6;
const stage=()=>{const h=ageH();return h<24?'kitten':h<24*30?'adult':'senior'};
function ageText(){const h=Math.floor(((s.alive?Date.now():s.goneAt)-s.born)/3.6e6);return h<24?`${h}h old`:`${Math.floor(h/24)}d ${h%24}h old`}

/* one simulated minute */
function tick(t){
  if(!s.alive)return;
  const h=1/60;
  s.full-=5*h;
  s.fun-=(s.asleep?2:6)*h;
  s.clean-=(1.5+s.poops*2.5)*h;
  s.energy+=(s.asleep?22:-5)*h;
  s.weight=Math.max(2.5,s.weight-0.004*h);
  if(s.asleep&&s.energy>=100){s.asleep=false;log('woke up and stretched',t)}
  if(!s.asleep&&s.energy<=2){s.asleep=true;log('dozed off on the floor',t)}
  if(!s.asleep&&s.poops<4&&Math.random()<h/3){s.poops++;log('made a mess on the floor',t)}
  const stress=(s.full<20)+(s.fun<15)+(s.clean<20)+(s.energy<8)+(s.poops>=3)+(s.weight>6.5);
  if(s.full<=0)s.health-=8*h;
  if(stress)s.health-=stress*2.5*h; else if(!s.sick)s.health+=3*h;
  if(s.sick)s.health-=2*h;
  else if(s.health<50&&Math.random()<h/4){s.sick=true;log('caught a cold',t)}
  clampAll();
  if(s.health<=0){s.alive=false;s.goneAt=t;log('wandered off',t)}
}
function catchUp(){
  if(!s)return;
  const n=Math.floor((Date.now()-s.last)/60000);
  if(n<=0)return;
  const steps=Math.min(n,20160);
  for(let i=0;i<steps;i++)tick(s.last+(i+1)*60000);
  s.last+=n*60000;
  save();
}

/* ---------- speech ---------- */
function say(m,ms=2600){anim.say=m;anim.sayUntil=Date.now()+ms;renderBubble()}
function mood(){
  if(!s.alive)return '';
  if(game)return `Pounce! ${Math.ceil((game.until-Date.now())/1000)}s · ${game.hits} hits`;
  if(s.asleep)return 'z z z…';
  if(s.sick)return 'Achoo… feeling sick';
  if(s.poops>=2)return 'Something smells…';
  if(s.full<25)return 'Mrrrow! Hungry!';
  if(s.energy<20)return '*big yawn*';
  if(s.fun<25)return 'Bored… play with me?';
  if(s.clean<25)return 'Feeling grubby';
  if(s.weight>6.5)return 'A little chonky…';
  const happy=['purrrr','*kneads the floor*','*slow blink*','mrrp?','*stares at nothing*'];
  return happy[Math.floor(Date.now()/9000)%happy.length];
}
function renderBubble(){
  const m=(anim.say&&Date.now()<anim.sayUntil)?anim.say:mood();
  const b=$('bubble'); if(b.textContent!==m)b.textContent=m;
  b.hidden=!m;
}

/* ---------- actions ---------- */
function act(k){
  if(!s||!s.alive)return;
  catchUp();
  if(k==='feed'){ $('feedSheet').hidden=!$('feedSheet').hidden; return }
  $('feedSheet').hidden=true;
  if(k==='pet'){
    if(Date.now()-anim.lastPet<1500)return;
    anim.lastPet=Date.now();
    if(s.asleep){s.fun+=1;say('*purrs in sleep*')}
    else{s.fun+=6;say('purrrrrrr ♥');for(let i=0;i<3;i++)anim.hearts.push({x:anim.x+8+i*10,y:40,t:Date.now()+i*150})}
  }
  else if(k==='play'){
    if(game)return;
    if(s.asleep)return say(`Shh, ${s.name} is asleep`);
    if(s.energy<15)return say('Too tired to chase…');
    if(s.sick)return say('Too sick to play');
    game={until:Date.now()+15000,hits:0,dot:{x:30,y:70},tgt:{x:90,y:72}};
    say('Tap the red dot!',1500);
  }
  else if(k==='clean'){
    if(s.poops===0&&s.clean>92)return say('Already spotless');
    s.poops=0;s.clean+=45;
    if(!s.asleep){s.fun-=4;say('*grumbles about the bath*')}else say('Tidied up quietly');
    anim.sparkle=Date.now()+1200;log('got cleaned up');
  }
  else if(k==='sleep'){
    if(s.asleep){
      s.asleep=false;
      if(s.energy<40){s.fun-=6;say('*grumpy glare*')}else say('*stretches*');
      log('was woken up');
    }else{
      if(s.energy>85)return say('Not sleepy!');
      s.asleep=true;log('curled up to sleep');say('Lights out…');
    }
  }
  else if(k==='meds'){
    if(!s.sick)return say('Healthy, no meds needed');
    s.sick=false;s.health+=25;s.fun-=10;log('took medicine (reluctantly)');say('*spits… then swallows*');
  }
  clampAll();save();renderUI();
}
function feed(kind){
  $('feedSheet').hidden=true;
  if(kind==='x')return;
  catchUp();
  if(s.asleep)return say(`Shh, ${s.name} is asleep`);
  if(s.full>=95)return say('*sniffs it and walks away*');
  if(kind==='kibble'){s.full+=30;s.weight+=0.05;log('ate some kibble')}
  else{s.full+=12;s.fun+=12;s.weight+=0.15;log('wolfed down a fish treat')}
  anim.eatUntil=Date.now()+2600;anim.tx=40;say('nom nom nom',2600);
  clampAll();save();renderUI();
}
function endGame(){
  const h=game.hits;game=null;
  s.energy-=6;s.weight=Math.max(2.5,s.weight-0.05*Math.min(h,6));
  log(h?`chased the laser (${h} pounce${h>1?'s':''})`:'ignored the laser');
  say(h>=6?'Best. Game. Ever.':h?'Fun!':'*unimpressed*');
  clampAll();save();renderUI();
}

/* ---------- canvas ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
function sprite(rows,x,y,sc,pal,flip){
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){
    const ch=rows[r][c]; if(ch==='.')continue;
    ctx.fillStyle=pal[ch]||'#000';
    const cx=flip?rows[r].length-1-c:c;
    ctx.fillRect(Math.round(x+cx*sc),Math.round(y+r*sc),sc,sc);
  }
}
function sky(){
  const h=new Date().getHours();
  if(h>=21||h<5)return ['#23304f',true];
  if(h<7)return ['#f2b48c',false];
  if(h<18)return ['#9fd3f0',false];
  return ['#e48a6c',false];
}
let lastFrame=0;
function draw(now){
  requestAnimationFrame(draw);
  if(now-lastFrame<50)return; lastFrame=now;
  if(!s)return;
  const t=Date.now();
  // room
  ctx.fillStyle='#e9dcc5';ctx.fillRect(0,0,128,96);
  ctx.fillStyle='#d9c6a6';for(let x=0;x<128;x+=8)ctx.fillRect(x,0,1,80);
  const [skyC,night]=sky();
  ctx.fillStyle='#6b4a33';ctx.fillRect(92,26,30,24);
  ctx.fillStyle=skyC;ctx.fillRect(94,28,26,20);
  if(night){ctx.fillStyle='#fff6c8';ctx.fillRect(98,31,1,1);ctx.fillRect(112,34,1,1);ctx.fillRect(105,42,1,1);ctx.fillRect(114,30,3,3)}
  else{ctx.fillStyle='#fff3a6';ctx.fillRect(112,31,4,4)}
  ctx.fillStyle='#6b4a33';ctx.fillRect(106,28,1,20);ctx.fillRect(94,37,26,1);
  ctx.fillStyle='#c4a87f';ctx.fillRect(0,80,128,16);
  ctx.fillStyle='#b39368';ctx.fillRect(0,80,128,1);
  // rug
  ctx.fillStyle='#d97b5a';ctx.fillRect(30,86,60,6);ctx.fillStyle='#e9a081';ctx.fillRect(34,88,52,2);

  if(!s.alive){ctx.fillStyle='#fff';ctx.fillRect(56,72,14,10);ctx.fillStyle='#999';ctx.fillRect(58,75,10,1);ctx.fillRect(58,78,8,1);return}

  const pal=palette(s.fur);
  // poops
  const spots=[[8,77],[112,79],[20,84],[100,86]];
  for(let i=0;i<s.poops;i++)sprite(POOP,spots[i][0],spots[i][1],2,pal,false);
  // bowl
  const eating=t<anim.eatUntil;
  if(eating)sprite(BOWL,30,80,2,{o:'#4c7fb8'},false);

  // movement
  const sc=stage()==='kitten'?2:3, w=16*sc, hgt=15*sc;
  if(game){
    if(t>game.until){endGame()}
    else{
      const d=game.dot,g=game.tgt;
      const dx=g.x-d.x,dy=g.y-d.y,dist=Math.hypot(dx,dy);
      if(dist<2)game.tgt={x:10+Math.random()*108,y:56+Math.random()*30};
      else{d.x+=dx/dist*2.2;d.y+=dy/dist*2.2}
      anim.tx=Math.max(0,Math.min(128-w,d.x-w/2));
    }
  }else if(!s.asleep&&!eating&&Math.random()<0.01){
    anim.tx=4+Math.random()*(124-w-4);
  }
  if(eating)anim.tx=40;
  const sp=game?2.4:0.6;
  if(!s.asleep&&Math.abs(anim.tx-anim.x)>1){const st=Math.sign(anim.tx-anim.x);anim.x+=st*sp;anim.dir=st}
  anim.x=Math.max(0,Math.min(128-w,anim.x));

  // frame
  let fr=SPR.idle;
  if(s.asleep)fr=SPR.blink;
  else if(eating)fr=(Math.floor(t/300)%2)?SPR.eat:SPR.blink;
  else if(s.sick)fr=SPR.sick;
  else if(s.full<20||s.fun<15)fr=SPR.sad;
  else if(t-anim.lastPet<1500||(game&&game.hits))fr=SPR.happy;
  else{ if(t>anim.blinkAt+3500)anim.blinkAt=t+Math.random()*2000; if(t>anim.blinkAt&&t<anim.blinkAt+160)fr=SPR.blink }
  const bob=(!s.asleep&&Math.abs(anim.tx-anim.x)>1)?(Math.floor(t/150)%2):(s.asleep?(Math.floor(t/900)%2):0);
  const y=84-hgt+bob;
  sprite(fr,anim.x,y,sc,pal,anim.dir<0);

  // sleep Zs
  if(s.asleep){
    ctx.fillStyle='#3b2a20';ctx.font='8px monospace';
    const k=(t/700)%3;
    ctx.fillText('z',anim.x+w-4,y-2-k*3);ctx.fillText('Z',anim.x+w+2,y-8-k*3);
  }
  // hearts
  anim.hearts=anim.hearts.filter(h=>t-h.t<1400);
  for(const h of anim.hearts){if(t<h.t)continue;const age=(t-h.t)/1400;sprite(HEART,h.x,h.y-age*24,2,{p:'#e85d8a'},false)}
  // sparkles
  if(t<anim.sparkle){ctx.fillStyle='#fff';for(let i=0;i<8;i++){const a=i*0.8+t/200;ctx.fillRect(anim.x+w/2+Math.cos(a)*w*.6,y+hgt/2+Math.sin(a)*hgt*.5,2,2)}}
  // laser
  if(game){ctx.fillStyle='#ff2d2d';ctx.fillRect(Math.round(game.dot.x)-1,Math.round(game.dot.y)-1,3,3);ctx.fillStyle='rgba(255,60,60,.35)';ctx.fillRect(Math.round(game.dot.x)-2,Math.round(game.dot.y)-2,5,5)}
  // lights off
  if(s.asleep){ctx.fillStyle='rgba(12,16,40,.55)';ctx.fillRect(0,0,128,96)}
  renderBubble();
}

cv.addEventListener('pointerdown',e=>{
  if(!s||!s.alive)return;
  if(game){
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*128,y=(e.clientY-r.top)/r.height*96;
    if(Math.hypot(x-game.dot.x,y-game.dot.y)<14){
      game.hits++;s.fun+=6;s.energy-=1.5;clampAll();
      game.tgt={x:10+Math.random()*108,y:56+Math.random()*30};
      game.dot={x:game.tgt.x>64?10:118,y:60+Math.random()*25};
      renderUI();
    }
    return;
  }
  act('pet');
});

/* ---------- UI ---------- */
const STATS=[['full','Food'],['fun','Fun'],['energy','Energy'],['clean','Clean'],['health','Health']];
$('stats').innerHTML=STATS.map(([k,l])=>`<div class="stat"><span>${l}</span><div class="bar"><i id="b_${k}"></i></div><output id="o_${k}"></output></div>`).join('');
function renderUI(){
  if(!s)return;
  for(const [k] of STATS){const v=Math.round(s[k]),b=$('b_'+k);b.style.width=v+'%';b.className=v<25?'low':v<50?'mid':'';$('o_'+k).textContent=v}
  $('nm').textContent=s.name;
  $('info').textContent=`${stage()} · ${s.weight.toFixed(1)}kg${s.sick?' · sick':''}`;
  $('ageTag').textContent=s.alive?ageText():'';
  $('sleepBtn').innerHTML=s.asleep?'<em>☀️</em>Wake':'<em>🌙</em>Sleep';
  document.querySelectorAll('#actions button').forEach(b=>b.disabled=!s.alive);
  const fmt=t=>{const d=new Date(t),today=new Date().toDateString()===d.toDateString();
    return today?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([], {month:'short',day:'numeric'})};
  $('log').innerHTML=s.log.map(e=>`<li><time>${fmt(e.t)}</time><span>${esc(s.name)} ${esc(e.m)}</span></li>`).join('');
  $('gone').hidden=s.alive;
  if(!s.alive)$('goneTxt').textContent=`${s.name} wandered off to find a home with more time for them. They lived ${ageText().replace(' old','')}.`;
}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function show(){
  const has=!!s;
  $('adopt').hidden=has;$('game').hidden=!has;$('release').hidden=!has;
  if(has){catchUp();renderUI()}
}

// adoption
$('furs').innerHTML=Object.entries(FURS).map(([k,f])=>`<button data-fur="${k}" aria-pressed="${k===furPick}"><i style="background:${f.f}"></i>${f.label}</button>`).join('');
$('furs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;furPick=b.dataset.fur;
  document.querySelectorAll('#furs button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('adoptBtn').onclick=()=>{
  const now=Date.now();
  s={name:($('nameIn').value.trim()||'Mochi'),fur:furPick,born:now,last:now,full:70,fun:70,energy:80,clean:90,health:100,
     weight:3.2,poops:0,asleep:false,sick:false,alive:true,log:[]};
  log('came home');save();show();say(`Hi! I'm ${s.name}`);
};
$('again').onclick=()=>{s=null;store.set(KEY,null);$('nameIn').value='';show()};
$('release').onclick=()=>{if(confirm('Release your cat and start over?')){s=null;store.set(KEY,null);game=null;show()}};
$('actions').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.act)});
$('feedSheet').addEventListener('click',e=>{const b=e.target.closest('button');if(b)feed(b.dataset.food)});

// idea queue
let ideas=store.get(IKEY)||[
  {t:'Reminder notifications when the cat is hungry',d:false},
  {t:'Hats and collars unlocked by care streaks',d:false},
  {t:'Second mini-game: catch falling fish',d:false},
  {t:'Hall of past cats',d:false},
  {t:'Two cats that interact',d:false}];
function renderIdeas(){
  $('ideaList').innerHTML=ideas.map((x,i)=>`<li class="${x.d?'done':''}"><input type="checkbox" data-i="${i}" ${x.d?'checked':''} aria-label="Done"><span>${esc(x.t)}</span><button data-del="${i}" aria-label="Delete">✕</button></li>`).join('');
  store.set(IKEY,ideas);
}
$('ideaAdd').onclick=()=>{const v=$('ideaIn').value.trim();if(!v)return;ideas.unshift({t:v,d:false});$('ideaIn').value='';renderIdeas()};
$('ideaIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('ideaAdd').click()});
$('ideaList').addEventListener('click',e=>{
  if(e.target.dataset.del!==undefined){ideas.splice(+e.target.dataset.del,1);renderIdeas()}
  else if(e.target.dataset.i!==undefined){ideas[+e.target.dataset.i].d=e.target.checked;renderIdeas()}
});
renderIdeas();

// clocks
setInterval(()=>{if(s){catchUp();renderUI()}},5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&s){catchUp();renderUI()}});
show();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
